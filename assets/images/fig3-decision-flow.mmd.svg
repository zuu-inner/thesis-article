<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 792 860" width="792" height="860" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:14px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Arial, Helvetica, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart">
<style><![CDATA[
/* =========================================
   Academic - Draw.io Classic
   Monochrome Traditional Flowchart
   ========================================= */

.pele {
    /* Background */
    --pele-bg: #ffffff;

    /* Typography */
    --pele-fg: #000000;
    --pele-fg-on-light: #000000;
    --pele-fg-on-dark: #ffffff;
    --pele-muted: #333333;

    /* Lines and borders */
    --pele-line: #000000;
    --pele-border: #000000;

    /* Node surfaces */
    --pele-surface: #ffffff;
    --pele-surface-alt: #ffffff;

    /* Accent and critical */
    --pele-accent: #000000;
    --pele-critical: #000000;

    /* Typography */
    --pele-font: Arial, Helvetica, sans-serif;
    --pele-font-mono: "Courier New", monospace;

    --pele-title-weight: bold;
    --pele-heading-weight: bold;
    --pele-bold-weight: bold;

    /* Monochrome palettes */
    --pele-series-1: #000000;
    --pele-series-2: #000000;
    --pele-series-3: #000000;
    --pele-series-4: #000000;
    --pele-series-5: #000000;
    --pele-series-6: #000000;
    --pele-series-7: #000000;
    --pele-series-8: #000000;
}

/* Typography */
.pele-label {
    font-family: Arial, Helvetica, sans-serif;
    fill: #000000;
}

.pele-edge-label {
    font-family: Arial, Helvetica, sans-serif;
    fill: #000000;
}

.pele-title,
.pele-cluster-label {
    font-family: Arial, Helvetica, sans-serif;
    fill: #000000;
}

/* Edges */
.pele-edge {
    color: #000000;
}

/* SVG background */
.pele {
    background: #ffffff;
}

/* Geometry */
.pele-node rect {
	rx: 4px;
	ry: 4px;
}
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_IN_T_0"><path d="M261.5,76L261.5,117"/><path class="pele-marker" d="M261.5,124L258.14,116L264.86,116Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_T_P_0"><path d="M217.3,184C217.3,210.5 129.75,210.5 129.75,237L129.75,243"/><path class="pele-marker" d="M129.75,250L126.39,242L133.11,242Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_T_BS_0"><path d="M305.7,184C305.7,201.5 393.26,201.5 393.26,219L393.26,225"/><path class="pele-marker" d="M393.26,232L389.9,224L396.62,224Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_BS_CI_0"><path d="M393.26,328L393.26,369"/><path class="pele-marker" d="M393.26,376L389.9,368L396.62,368Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_CI_I_0"><path d="M393.26,436L393.26,477"/><path class="pele-marker" d="M393.26,484L389.9,476L396.62,476Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_I_C1_0"><path d="M377.26,557.25C377.26,572.09 126.6,572.9 126.6,587.75L126.6,630.25"/><path class="pele-marker" d="M126.6,637.25L123.24,629.25L129.96,629.25Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_I_C2_0"><path d="M393.26,567.25L393.26,630.25"/><path class="pele-marker" d="M393.26,637.25L389.9,629.25L396.62,629.25Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_I_C3_0"><path d="M409.26,557.25C409.26,571.93 662.64,573.06 662.64,587.75L662.64,630.25"/><path class="pele-marker" d="M662.64,637.25L659.28,629.25L666,629.25Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_C1_L_0"><path d="M126.6,697.25C126.6,722.05 188.05,737.25 288.32,737.25C388.58,737.25 450.03,743.23 450.03,753L450.03,758.25"/><path class="pele-marker" d="M450.03,765.25L446.67,757.25L453.39,757.25Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_C2_L_0"><path d="M393.26,697.