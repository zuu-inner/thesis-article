<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 576 1022" width="576" height="1022" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:14px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Arial, Helvetica, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart">
<style><![CDATA[
/* =========================================
   Academic - Draw.io Classic
   Monochrome Traditional Flowchart
   ========================================= */

.pele {
    /* Background */
    --pele-bg: #ffffff;

    /* Typography */
    --pele-fg: #000000;
    --pele-fg-on-light: #000000;
    --pele-fg-on-dark: #ffffff;
    --pele-muted: #333333;

    /* Lines and borders */
    --pele-line: #000000;
    --pele-border: #000000;

    /* Node surfaces */
    --pele-surface: #ffffff;
    --pele-surface-alt: #ffffff;

    /* Accent and critical */
    --pele-accent: #000000;
    --pele-critical: #000000;

    /* Typography */
    --pele-font: Arial, Helvetica, sans-serif;
    --pele-font-mono: "Courier New", monospace;

    --pele-title-weight: bold;
    --pele-heading-weight: bold;
    --pele-bold-weight: bold;

    /* Monochrome palettes */
    --pele-series-1: #000000;
    --pele-series-2: #000000;
    --pele-series-3: #000000;
    --pele-series-4: #000000;
    --pele-series-5: #000000;
    --pele-series-6: #000000;
    --pele-series-7: #000000;
    --pele-series-8: #000000;
}

/* Typography */
.pele-label {
    font-family: Arial, Helvetica, sans-serif;
    fill: #000000;
}

.pele-edge-label {
    font-family: Arial, Helvetica, sans-serif;
    fill: #000000;
}

.pele-title,
.pele-cluster-label {
    font-family: Arial, Helvetica, sans-serif;
    fill: #000000;
}

/* Edges */
.pele-edge {
    color: #000000;
}

/* SVG background */
.pele {
    background: #ffffff;
}

/* Geometry */
.pele-node rect {
	rx: 4px;
	ry: 4px;
}
